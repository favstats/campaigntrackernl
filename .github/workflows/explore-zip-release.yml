name: Release explore.zip

on:
  push:
    branches:
      - main
    # If you want to run on EVERY push regardless of what changed,
    # delete the following 2 lines:
    paths:
      - 'docs/explore/**'

permissions:
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP (docs/explore → explore.zip)
        run: |
          if [ ! -d docs/explore ]; then
            echo "::error::docs/explore not found"
            exit 1
          fi
          zip -r -q explore.zip docs/explore
          ls -lh explore.zip

      - name: Ensure tag 'explore-latest' points to this commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f explore-latest
          git push -f origin refs/tags/explore-latest

      - name: Create/Update 'explore-latest' release
        uses: ncipollo/release-action@v1
        with:
          tag: explore-latest
          name: "Explore latest"
          body: |
            Automatisch generiertes ZIP von docs/explore
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          artifacts: "explore.zip"
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: true
          prerelease: true