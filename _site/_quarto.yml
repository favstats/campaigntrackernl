project:
  type: website
  output-dir: ../docs

website:
  title: "&nbsp;&nbsp;Dashboard"
  favicon: "RoundLogoSchriftzug_blue.png"
  navbar:
    logo: "LogoSchriftzug.png"
    left:
      - href: index.qmd
        text: "{{< iconify ph star-four-light >}} AI Tracker"
      - href: https://favstats.github.io/campaigntrackernl/explore
        text: "{{< iconify ph binoculars-light >}} AI Explorer"
      - href: blog.qmd
        text: "{{< iconify ph newspaper-light >}} Blog"
      - href: info.qmd
        text: "{{< iconify ph info-light >}} Info"
    right:
      - href: https://favstats.github.io/nl25/
        text: "{{< iconify material-symbols:target >}} Targeting Tracker"        
        id: targeting-tracker
      - text: "en {{< iconify emojione flag-for-united-kingdom >}}"
        href: "https://www.campaigntracker.nl/en"
  page-footer:
    background: light # or dark
    left:
      - text: "Copyright 2025, CampAIgn Tracker (Click for Imprint)"
        href: https://favstats.github.io/campaigntrackernl/impressum.html
      - text: "Data Privacy Declaration"
        href: https://favstats.github.io/campaigntrackernl/datenschutz.html
    right:
      - text: "RPA Grants (UvA) & SIDN Fonds"
        href: "https://aissr.uva.nl/content/news/2025/01/call-for-ai--politics-seed-grants.html"

    
format:
  html:
    theme:
      - cosmo
      - custom.scss
    fontsize: 1.2em
    include-in-header:
      text: |
        <!-- Plausible (site-specific script) -->
        <script defer data-external="1"
                src="https://plausible.io/js/pa-rqPvCO0myNv3ooL2Rc_5o.js"></script>
        <script>
          /* queue + init exactly as Plausible shows */
          window.plausible = window.plausible || function(){ (plausible.q = plausible.q || []).push(arguments) };
          plausible.init({
            /* Optional extras — uncomment as needed: */
            // outboundLinks: true,
            // fileDownloads: true,
            // formSubmissions: true,
            // hashBasedRouting: false,
            // captureOnLocalhost: true   // only for local preview
          });
        </script>