project:
  type: website
  output-dir: ../../docs/en
  
website:
  title: "&nbsp;&nbsp;Dashboard"
  favicon: "RoundLogoSchriftzug_blue.png"
  navbar:
    logo: "LogoSchriftzug.png"
    left:
      - href: index.qmd
        text: "{{< iconify ph star-four-light >}} AI Tracker"
      - href: https://favstats.github.io/campaigntrackernl/explore
        text: "{{< iconify ph binoculars-light >}} AI Explorer"
      - href: https://favstats.github.io/campaigntrackernl/blog
        text: "{{< iconify ph newspaper-light >}} Blog"
      - href: info.qmd
        text: "{{< iconify ph info-light >}} Info"
    right:
      - href: https://favstats.github.io/nl25/
        text: "{{< iconify material-symbols:target >}} Targeting Tracker"        
        id: targeting-tracker
      - text: "nl {{< iconify emojione flag-for-netherlands >}}"
        href: "https://www.campaigntracker.nl"
  page-footer:
    background: light # or dark
    left:
      - text: "Copyright 2025"
        href: https://favstats.github.io/campaigntrackernl/impressum.html
      - text: "Data Privacy"
        href: https://favstats.github.io/campaigntrackernl/datenschutz.html
    center: |
      As featured in:
      ![](/mediacov.png)
    right:
      - text: "RPA Grants (UvA) & SIDN Fonds"
        href: "https://aissr.uva.nl/content/news/2025/01/call-for-ai--politics-seed-grants.html"

    
format:
  html:
    theme:
      - cosmo
      - custom.scss
    fontsize: 1.2em
    include-in-header:
      text: |
        <!-- Privacy-friendly analytics by Plausible -->
        <script async src="https://plausible.io/js/pa-rqPvCO0myNv3ooL2Rc_5o.js"></script>
        <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
        </script>
        <script data-goatcounter="https://favstats.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>